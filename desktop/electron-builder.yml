appId: co.uk.globaltechprofessionals.autolabelflow
productName: AutoLabelFlow
copyright: Copyright (c) 2026 Mpradeep-dev. All Rights Reserved.

directories:
  output: dist
  buildResources: build

# The shell's own files + production node_modules (electron-updater) go into
# app.asar; everything heavy (the Python runtime, the built SPA, ffmpeg)
# rides along as extraResources, referenced by path from main.js.
files:
  - main.js
  - preload.js
  - package.json
  - icon.ico
  - node_modules/**/*
  - "!node_modules/.cache"

extraResources:
  - from: build/python
    to: python
  - from: build/frontend
    to: frontend
  - from: build/bin
    to: bin

win:
  target:
    - nsis
  # Generated from frontend/public/favicon.png by scripts/make-icon.py.
  # Drives the exe icon (via the rcedit pass), the NSIS installer icon, and
  # the installed Start Menu / desktop shortcuts.
  icon: icon.ico
  # Versionless so the README's one-click link stays valid across releases:
  #   github.com/<owner>/<repo>/releases/latest/download/AutoLabelFlow-Setup.exe
  # electron-updater reads the real version from latest.yml, not the filename.
  artifactName: ${productName}-Setup.${ext}
  # The build is still unsigned (no certificateFile). The rcedit pass that
  # embeds icon.ico + version strings into the exe runs by default; it needs
  # electron-builder's winCodeSign helper, whose archive carries macOS
  # symlinks that only extract on Windows with admin / Developer Mode. The
  # release-desktop workflow runs on windows-latest (admin), so it is fine
  # there; for a local build, enable Windows Developer Mode first. See
  # RELEASING.md.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

# Manual "Check for updates" button -> electron-updater -> public GitHub Releases.
publish:
  provider: github
  owner: Mpradeep-dev
  repo: Auto_Label_Flow
  releaseType: release
